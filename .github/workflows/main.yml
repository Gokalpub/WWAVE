name: Otomatik İmzalı APK ve Google Play AAB Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v4

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: İmzalı APK ve Google Play AAB Derle
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: İmzalı APK Dosyasını İndirilebilir Paket Yap
        uses: actions/upload-artifact@v4
        with:
          name: WaveClean-Imzali-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Google Play AAB Dosyasını İndirilebilir Paket Yap
        uses: actions/upload-artifact@v4
        with:
          name: WaveClean-GooglePlay-AAB
          path: app/build/outputs/bundle/release/*.aab
